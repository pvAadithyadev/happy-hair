<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Operation Happy Hair</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout concept: one cozy diary page on a bedroom desk. Tiny Aadi is a sticker in the margin
   (left on desktop, on top on phones) who talks and reacts; the diary card to his side holds each chapter.
   A washi-tape progress strip with a travelling heart runs along the top. */
:root{
  --desk:#F7E7E0; --desk-2:#F2DADC;
  --paper:#FFF9F2; --paper-2:#FFF0E6; --paper-3:#FDE7EC;
  --ink:#4A332B; --ink-soft:#7B6056; --ink-faint:#A08980;
  --rose:#B8456A; --rose-soft:#F4B7C4; --rose-wash:#FBDDE4;
  --lav:#E6DCF6; --lav-deep:#8D76BF;
  --peach:#FFD6BC; --peach-deep:#E4A07A;
  --sage:#D4E8D2; --sage-ink:#2F5B3A;
  --warn:#FFE9C7; --warn-ink:#6E420A; --warn-line:#E6BB72;
  --line:rgba(74,51,43,.16); --shadow:rgba(120,70,60,.18); --stitch:rgba(184,69,106,.28);
  --btn-bg:#B8456A; --btn-fg:#FFF8F4; --focus:#6B43C8;
  --halo:#FBD9E1; --tape1:#F8C9D4; --tape2:#FBE0C9;
  --sky1:#FDEBF0; --sky2:#E9DFF8; --grass:#CFE6CB;
  --bubble:#FFFDF9; --bubble-ink:#4A332B;
  --f-display:'Caveat','Segoe Print','Bradley Hand',cursive;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#241A1F; --desk-2:#2D2027;
    --paper:#35272D; --paper-2:#41313A; --paper-3:#4B3540;
    --ink:#F6E7E1; --ink-soft:#CDB4AC; --ink-faint:#9C857F;
    --rose:#F28FA8; --rose-soft:#8A4B5E; --rose-wash:#503040;
    --lav:#443A5E; --lav-deep:#B7A3E6;
    --peach:#59403A; --peach-deep:#E0A27C;
    --sage:#33493A; --sage-ink:#BDE3C3;
    --warn:#4F3C1F; --warn-ink:#FFD99A; --warn-line:#8A6A2E;
    --line:rgba(246,231,225,.2); --shadow:rgba(0,0,0,.4); --stitch:rgba(242,143,168,.3);
    --btn-bg:#F28FA8; --btn-fg:#2E1520; --focus:#C8B6FF;
    --halo:#E9C9D3; --tape1:#8A4B5E; --tape2:#6E5A3C;
    --sky1:#3B2D42; --sky2:#2B2233; --grass:#36513E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#241A1F; --desk-2:#2D2027;
  --paper:#35272D; --paper-2:#41313A; --paper-3:#4B3540;
  --ink:#F6E7E1; --ink-soft:#CDB4AC; --ink-faint:#9C857F;
  --rose:#F28FA8; --rose-soft:#8A4B5E; --rose-wash:#503040;
  --lav:#443A5E; --lav-deep:#B7A3E6;
  --peach:#59403A; --peach-deep:#E0A27C;
  --sage:#33493A; --sage-ink:#BDE3C3;
  --warn:#4F3C1F; --warn-ink:#FFD99A; --warn-line:#8A6A2E;
  --line:rgba(246,231,225,.2); --shadow:rgba(0,0,0,.4); --stitch:rgba(242,143,168,.3);
  --btn-bg:#F28FA8; --btn-fg:#2E1520; --focus:#C8B6FF;
  --halo:#E9C9D3; --tape1:#8A4B5E; --tape2:#6E5A3C;
  --sky1:#3B2D42; --sky2:#2B2233; --grass:#36513E;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{height:100%}
body{
  background:var(--desk);
  background-image:radial-gradient(circle at 12% 8%,var(--desk-2) 0,transparent 42%),radial-gradient(circle at 92% 70%,var(--desk-2) 0,transparent 40%);
  color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px;min-height:100%;overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--desk);z-index:30}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4,p,ul{margin:0}
h1,h2{font-family:var(--f-display);font-weight:700;line-height:1.05;text-wrap:balance;letter-spacing:.2px}
h1{font-size:clamp(2.1rem,8vw,3.1rem)}
h2{font-size:clamp(1.9rem,6.4vw,2.35rem)}
h3{font-size:1.05rem;font-weight:800;line-height:1.3}
h4{font-size:1rem;font-weight:800;line-height:1.3}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.fine{font-size:.88rem;color:var(--ink-soft)}
.script{font-family:var(--f-display);font-weight:600}

/* floating doodles */
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco svg{position:absolute;opacity:.55;animation:floaty 9s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-14px) rotate(calc(var(--r,0deg) + 6deg))}}

/* top bar */
.app{position:relative;z-index:1;max-width:1100px;margin:0 auto}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 0;background:var(--desk)}
.tbtn{flex:none;display:inline-flex;align-items:center;gap:6px;height:44px;min-width:44px;padding:0 14px;justify-content:center;border-radius:999px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-weight:700;font-size:.92rem}
.tbtn:disabled{opacity:.4;cursor:default}
.tape-wrap{flex:1;min-width:0}
.tape{position:relative;height:16px;border-radius:999px;background:var(--paper-3);border:1.5px solid var(--line)}
.tape i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:repeating-linear-gradient(45deg,var(--tape1) 0 9px,var(--tape2) 9px 18px);transition:width .5s ease}
.tape span{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;color:var(--rose);transition:left .5s ease;filter:drop-shadow(0 2px 2px var(--shadow))}
.tape-label{margin-top:4px;font-size:.78rem;font-weight:700;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* layout */
.shell{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding-top:6px}
@media (min-width:940px){
  .shell{grid-template-columns:minmax(280px,360px) minmax(0,660px);justify-content:center;gap:40px;align-items:start;padding-top:18px}
  .stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px)}
}

/* Aadi stage */
.stage{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:end;gap:10px;min-width:0}
@media (min-width:940px){.stage{display:flex;flex-direction:column-reverse;align-items:center;gap:18px}}
.aadi{position:relative;display:grid;place-items:end center;border:0;background:none;padding:0 6px 8px;cursor:pointer;min-width:90px;transform-origin:50% 100%}
.aadi::before{content:"";position:absolute;left:6%;right:6%;bottom:6px;height:78%;background:var(--halo);border-radius:48% 52% 46% 54% / 55% 48% 52% 45%;z-index:0;box-shadow:0 14px 24px -14px var(--shadow)}
.aadi img{position:relative;z-index:1;display:block;max-width:none}
.aadi.enter{animation:slideInL .9s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes slideInL{from{transform:translateX(-80px);opacity:0}to{transform:none;opacity:1}}
.aadi.bounce-soft img{animation:bob 3.2s ease-in-out infinite}
.aadi.hop img{animation:hop .9s ease-in-out infinite}
.aadi.wave img{animation:sway 1.2s ease-in-out infinite;transform-origin:50% 100%}
.aadi.wobble img{animation:wobble 2.6s ease-in-out infinite;transform-origin:50% 100%}
.aadi.sob img{animation:sob .5s ease-in-out infinite;transform-origin:50% 100%}
.aadi.shake-soft img{animation:shake .35s ease-in-out 3;transform-origin:50% 100%}
.aadi.snooze img{animation:snooze 3.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wobble{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes sob{0%,100%{transform:translateY(0)}50%{transform:translateY(2px) scaleY(.99)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes snooze{0%,100%{transform:scale(1)}50%{transform:scale(1.02,.98)}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:2}
.fx .fl{position:absolute;color:var(--rose);animation:rise 2.4s ease-in infinite;opacity:0}
.fx .fl:nth-child(2){animation-delay:.8s}.fx .fl:nth-child(3){animation-delay:1.6s}
.fx .z{position:absolute;font-family:var(--f-display);font-weight:700;font-size:1.7rem;color:var(--lav-deep);animation:rise 3s ease-in infinite;opacity:0}
.fx .z:nth-child(2){animation-delay:1s;font-size:2.1rem}.fx .z:nth-child(3){animation-delay:2s;font-size:2.5rem}
@keyframes rise{0%{transform:translateY(10px) scale(.8);opacity:0}20%{opacity:1}100%{transform:translateY(-46px) scale(1.1);opacity:0}}
.bubble{position:relative;background:var(--bubble);color:var(--bubble-ink);border:2px solid var(--line);border-radius:22px;padding:12px 16px;box-shadow:0 8px 20px -10px var(--shadow);min-width:0}
.bubble p{font-family:var(--f-display);font-weight:700;font-size:clamp(1.25rem,4.6vw,1.5rem);line-height:1.2;overflow-wrap:anywhere}
.bubble::after{content:"";position:absolute;left:-9px;bottom:26px;width:16px;height:16px;background:var(--bubble);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble.pop{animation:pop .35s ease both}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:940px){
  .bubble{width:100%;padding:16px 20px}
  .bubble::after{left:50%;bottom:-9px;margin-left:-8px;border-left:0;border-bottom:2px solid var(--line);border-right:2px solid var(--line);transform:rotate(45deg)}
}
.toast{position:absolute;left:50%;top:-8px;transform:translate(-50%,-100%);background:var(--lav);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:800;white-space:nowrap;animation:pop .3s ease both;z-index:3}

/* page + cards */
.page{display:flex;flex-direction:column;gap:20px;min-width:0;outline:none}
.page.enter{animation:pageIn .42s cubic-bezier(.2,.8,.2,1) both}
.page.enter.back{animation-name:pageInBack}
@keyframes pageIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes pageInBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.card{position:relative;background:var(--paper);border-radius:26px;padding:28px 22px;box-shadow:0 14px 30px -16px var(--shadow),0 0 0 1.5px var(--line);display:flex;flex-direction:column;gap:14px;min-width:0}
.card::after{content:"";position:absolute;inset:8px;border:1.5px dashed var(--stitch);border-radius:19px;pointer-events:none}
.card.taped::before{content:"";position:absolute;top:-12px;left:50%;width:100px;height:26px;margin-left:-50px;transform:rotate(-2deg);background:repeating-linear-gradient(45deg,var(--tape1) 0 8px,var(--tape2) 8px 16px);border-radius:3px;box-shadow:0 2px 4px var(--shadow);opacity:.95}
.card.tilt{transform:rotate(-.6deg)}
.card.tilt2{transform:rotate(.5deg)}
.card.soft{background:var(--paper-2)}
.card.lav{background:var(--lav)}
.tag{align-self:flex-start;background:var(--rose-wash);color:var(--ink);border-radius:999px;padding:4px 14px;font-size:.82rem;font-weight:800;letter-spacing:.04em}
.sub{font-family:var(--f-display);font-weight:600;font-size:1.45rem;line-height:1.2;color:var(--rose)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:2px solid transparent;font-weight:800;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;text-align:center}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--btn-bg);color:var(--btn-fg);box-shadow:0 8px 16px -8px var(--shadow)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.soft{background:var(--paper-3);border-color:var(--line);color:var(--ink)}
.btn.big{min-height:56px;font-size:1.1rem;padding:0 30px}
.btn.sm{min-height:38px;padding:0 14px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.nav{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding-top:6px}
.nav .grow{flex:1}

/* chips */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.chip{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;min-height:54px;border:2px solid var(--line);background:var(--paper-2);border-radius:16px;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.chip:hover{transform:translateY(-1px);border-color:var(--rose-soft)}
.chip .box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--ink-faint);display:grid;place-items:center;color:transparent;transition:all .15s}
.chip[role=radio] .box{border-radius:50%}
.chip[aria-checked=true],.chip[aria-pressed=true]{border-color:var(--rose);background:var(--rose-wash)}
.chip[aria-checked=true] .box{background:var(--rose);border-color:var(--rose);color:var(--btn-fg)}
.chip[aria-checked=true] .box svg{animation:pop .25s ease both}

/* questionnaire */
.qhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:14px;height:14px;padding:0;border-radius:50%;border:2px solid var(--ink-faint);background:transparent;cursor:pointer}
.dot.done{background:var(--rose-soft);border-color:var(--rose)}
.dot.on{background:var(--rose);border-color:var(--rose);transform:scale(1.25)}
.prompt{font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1.15;color:var(--rose)}
.private{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;background:var(--lav);border-radius:14px;padding:10px 12px;color:var(--ink)}
.private svg{flex:none;margin-top:3px}
.linkbtn{background:none;border:0;padding:6px 2px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:700}

/* intro visuals */
.facts{list-style:none;padding:0;display:grid;gap:10px}
.facts li{display:flex;gap:12px;align-items:flex-start}
.facts svg{flex:none;margin-top:3px;color:var(--rose)}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.cmp{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:18px;border:2px solid var(--line);background:var(--paper-2);cursor:pointer;min-width:0}
.cmp[aria-pressed=true]{border-color:var(--rose);background:var(--rose-wash)}
.cmp svg{width:100%;height:auto;display:block}
.cmp strong{font-weight:800}
.cmp .more{font-size:.92rem;color:var(--ink-soft)}
.cmp[aria-pressed=true] .more{color:var(--ink)}

/* results */
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;background:var(--paper-3);border:1.5px solid var(--line);font-size:.84rem;font-weight:700}
.pill.skipped{opacity:.7;border-style:dashed}
.rgroup{display:grid;gap:6px}
.factor{padding:16px;border-radius:18px;background:var(--paper-2);border:1.5px solid var(--line);display:grid;gap:8px}
.factor .because{font-size:.88rem;color:var(--ink-soft)}
.factor .help{font-size:.95rem;background:var(--paper);border-radius:12px;padding:8px 12px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:18px;background:var(--warn);color:var(--warn-ink);border:2px solid var(--warn-line)}
.banner.ok{background:var(--sage);color:var(--sage-ink);border-color:transparent}
.banner svg{flex:none;margin-top:2px}
.banner ul{margin:6px 0 0;padding-left:18px}
.banner h3{font-size:1.05rem}
.legend{display:grid;gap:4px;font-size:.9rem;color:var(--ink-soft)}
.steps{display:grid;gap:10px}
.note{font-size:.88rem;color:var(--ink-soft)}
textarea.docnote{width:100%;min-height:200px;resize:vertical;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--paper-2);color:var(--ink);font:inherit;font-size:.9rem;line-height:1.5}
details.more{border-radius:14px}
details.more summary{cursor:pointer;font-weight:800;padding:6px 0}

/* food */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg .chip{min-height:46px;padding:8px 14px;flex:1 1 140px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.tab{flex:none;padding:9px 16px;border-radius:999px;border:2px solid var(--line);background:var(--paper-2);font-weight:800;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{background:var(--rose);border-color:var(--rose);color:var(--btn-fg)}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.food{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:18px;background:var(--paper-2);border:1.5px solid var(--line);min-width:0}
.food.in{border-color:var(--rose);background:var(--rose-wash)}
.food .amt{font-weight:800;font-size:.9rem;color:var(--rose)}
.food .how{font-size:.94rem;flex:1}
.badge{align-self:flex-start;font-size:.72rem;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--peach);color:var(--ink)}
.meter{display:flex;flex-wrap:wrap;gap:8px}
.meter span{padding:6px 12px;border-radius:999px;border:2px dashed var(--ink-faint);font-size:.85rem;font-weight:800;color:var(--ink-soft)}
.meter span.on{border:2px solid var(--sage-ink);background:var(--sage);color:var(--sage-ink)}
.plate-items{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.plate-items .pill{display:inline-flex;align-items:center;gap:6px;background:var(--rose-wash);border-color:var(--rose)}
.plate-items button{border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center;width:22px;height:22px}
.day{display:grid;gap:10px}
.day div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:start}
.day b{font-family:var(--f-display);font-size:1.25rem;color:var(--rose);font-weight:700}
@media (max-width:420px){.day div{grid-template-columns:1fr;gap:0}}

/* care + myths */
.habit{border-radius:18px;background:var(--paper-2);border:1.5px solid var(--line);padding:4px 14px}
.habit.in{border-color:var(--rose);background:var(--rose-wash)}
.habit summary{display:flex;gap:10px;align-items:center;list-style:none;cursor:pointer;padding:10px 0;font-weight:800;min-height:48px}
.habit summary::-webkit-details-marker{display:none}
.habit .body{display:grid;gap:10px;padding:0 0 14px}
.qz{display:grid;gap:14px}
.qz .stmt{font-family:var(--f-display);font-weight:700;font-size:1.65rem;line-height:1.15;text-wrap:balance}
.qz .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.verdict{padding:14px;border-radius:16px;display:grid;gap:4px}
.verdict.good{background:var(--sage);color:var(--sage-ink)}
.verdict.bad{background:var(--warn);color:var(--warn-ink)}

/* game */
.hud{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-weight:800}
.hbar{flex:1 1 160px;height:16px;border-radius:999px;background:var(--paper-3);border:1.5px solid var(--line);overflow:hidden}
.hbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--rose) 0 9px,var(--rose-soft) 9px 18px);transition:width .2s}
.board{position:relative;height:360px;border-radius:22px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2));border:2px solid var(--line);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.board::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--grass);border-top:2px solid var(--line);border-radius:50% 50% 0 0/18px 18px 0 0;pointer-events:none}
.gi{position:absolute;left:0;top:0;width:54px;height:54px;padding:0;border:0;background:none;cursor:pointer;will-change:transform;touch-action:manipulation}
.gi svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 3px var(--shadow))}
.over{position:absolute;inset:0;z-index:3;display:grid;place-items:center;text-align:center;padding:20px;background:color-mix(in srgb,var(--paper) 88%,transparent)}
.over>div{display:grid;gap:12px;justify-items:center;max-width:380px}
.pop-score{position:absolute;z-index:2;font-weight:800;pointer-events:none;animation:rise 1s ease-out both;color:var(--rose)}

/* letter */
.env{display:grid;place-items:center;gap:14px}
.env button.seal{display:grid;place-items:center;gap:10px;width:min(100%,360px);padding:28px 20px;border-radius:20px;border:2px solid var(--line);background:linear-gradient(160deg,var(--peach),var(--rose-wash));cursor:pointer;font-weight:800}
.env button.seal svg{width:56px;height:56px;color:var(--rose)}
.letter{background:var(--paper-2);border-radius:18px;padding:26px 22px;box-shadow:inset 0 0 0 1.5px var(--line);background-image:repeating-linear-gradient(transparent 0 33px,var(--line) 33px 34px);animation:unfold .7s ease both;transform-origin:top}
@keyframes unfold{from{opacity:0;transform:scaleY(.6)}to{opacity:1;transform:none}}
.letter p{font-family:var(--f-display);font-weight:600;font-size:clamp(1.3rem,4.6vw,1.6rem);line-height:34px;margin-bottom:34px}
.letter p.sig{font-size:1.9rem;color:var(--rose);margin-bottom:0}

/* album */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.slot{display:grid;gap:6px;justify-items:center;padding:10px 6px;border-radius:16px;background:var(--paper-2);border:1.5px solid var(--line);cursor:pointer;text-align:center;font-size:.82rem;font-weight:800}
.slot .ph{height:96px;display:grid;place-items:center;width:100%;background:var(--halo);border-radius:14px}
.slot img{max-height:88px;max-width:90%;display:block}
.slot.lock img{filter:brightness(0);opacity:.18}
.slot.lock{color:var(--ink-soft)}

/* map overlay */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(40,20,28,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{width:min(100%,460px);max-height:100%;overflow:auto;background:var(--paper);border-radius:26px;padding:24px 20px;display:grid;gap:12px;box-shadow:0 20px 50px -10px rgba(0,0,0,.5)}
.chap{display:flex;gap:10px;align-items:center;justify-content:space-between;text-align:left;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--paper-2);cursor:pointer;font-weight:800;min-height:48px}
.chap.now{border-color:var(--rose);background:var(--rose-wash)}
.chap:disabled{opacity:.45;cursor:default}
.foot{padding:28px 0 8px;text-align:center;font-size:.84rem;color:var(--ink-soft);max-width:640px;margin:0 auto}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .deco svg{animation:none}
}
@media (max-width:939px){.deco>div:nth-child(n+8){display:none}}
</style>

screens.q={

  var dots=Q.map(function(x,j){return '<button type="button" class="dot'+(j===i?' on':(S.ans[x.id]&&S.ans[x.id].length?' done':''))+'" aria-label="Go to question '+(j+1)+'" data-act="goq" data-i="'+j+'"></button>'}).join('');
  return '<div class="card taped"><div class="qhead"><span class="eyebrow">Question '+(i+1)+' of '+Q.length+'</span><div class="dots">'+dots+'</div></div>'+
  '<h2>'+q.title+'</h2>'+(q.prompt?'<p class="prompt">'+q.prompt+'</p>':'')+
  (q.sensitive?'<p class="private">'+I.lock+'<span>This one is private. Skip it whenever you like. Your answers stay on this device.</span></p>':'')+
  '<p class="fine">'+q.hint+'</p>'+

  '<div class="nav"><button class="btn ghost" data-act="back">Previous</button>'+(q.sensitive?'<button class="linkbtn" data-act="skipq">I’d rather skip this</button>':'')+
  '<button class="btn primary" id="qNext" data-act="next"></button></div></div>';},
 mount:function(id){syncQ(+id.slice(1))},
 mood:function(id){var q=Q[+id.slice(1)];return ['think',q.prompt?q.prompt:q.title]}
};
function syncQ(i){
  var q=Q[i],sel=S.ans[q.id]||[],b=$('#qNext');if(!b)return;
  var last=i===Q.length-1;
  if(!sel.length){b.textContent=last?'Skip and see what we learned':'Skip this one';b.className='btn soft'}
  else{b.textContent=last?'See what we learned ♡':'Next ♡';b.className='btn primary'}
}
function toggleChip(qid,oid,btn){
  var q=Qmap[qid],o=q.opts.filter(function(x){return x.id===oid})[0];
  var sel=(S.ans[qid]||[]).slice(),idx=sel.indexOf(oid),on;
  if(idx>-1){sel.splice(idx,1);on=false}
  else{
    if(o.x)sel=[];
    else{
      sel=sel.filter(function(id){var p=q.opts.filter(function(z){return z.id===id})[0];return !(p.x||(o.g&&p.g===o.g))});
    }
    sel.push(oid);on=true;
  }
  S.ans[qid]=sel;save();
  $$('.chip',btn.parentNode).forEach(function(c){c.setAttribute('aria-checked',sel.indexOf(c.dataset.o)>-1)});
  syncQ(+FLOW[cur].slice(1));
  if(on&&o.r)say(o.r[1],o.r[0]);
  else if(!sel.length)say('Skipping is allowed. Take your time.','think');
}
screens.result={
 mood:function(){var r=compute();return r.flags.length?['worried','I’m right here, {pet}. A doctor visit is just the sensible next step, and we’ll do it together.']:['happy','Okay! I put everything together. Read it slowly, {pet}. I’ll be right here.']},
 html:function(){
  var r=compute(),h='';
  h+='<div class="card taped"><h2>Here’s what we learned together, baby ♡</h2>'+
   '<div class="legend"><span><b>What you told me</b> is real information.</span><span><b>Possible contributors</b> are ideas to explore, never a diagnosis.</span><span><b>What I don’t know</b> matters just as much.</span></div></div>';
  if(!r.anyAns){
    h+='<div class="card"><h3>You skipped most of the questions</h3><p>That’s completely okay. Without answers I can’t point at anything, but the basics help almost everyone: eat regularly, sleep well, style gently, and see a doctor if it worries you or goes on for a few months.</p></div>';
  }
  if(r.flags.length){
    h+='<div class="banner" role="note">'+I.info+'<div><h3>Let’s get this looked at, {pet}</h3><p>These answers are worth a proper visit. A dermatologist is the best first stop, or your regular doctor.</p><ul>'+r.flags.map(function(f){return '<li>'+f.text+'</li>'}).join('')+'</ul></div></div>';
  }else if(r.anyAns){
    h+='<div class="banner ok" role="note">'+I.info+'<div><h3>Nothing here says “rush”</h3><p>Your answers don’t include the signs doctors worry about most. Still, if it carries on beyond about 3 months, or you’re worried, getting checked is always a good idea.</p></div></div>';
  }
  h+='<div class="card"><h3>1. What you told me</h3>';
  if(S.onset)h+='<div class="rgroup"><span class="eyebrow">First noticed</span><div class="pills"><span class="pill">'+onsetLabel()+'</span></div></div>';
  r.rep.forEach(function(g){h+='<div class="rgroup"><span class="eyebrow">'+g.name+'</span><div class="pills">'+g.items.map(function(t){return '<span class="pill">'+t+'</span>'}).join('')+'</div></div>'});
  if(r.skipped.length)h+='<div class="rgroup"><span class="eyebrow">Left blank</span><div class="pills">'+r.skipped.map(function(t){return '<span class="pill skipped">'+t+'</span>'}).join('')+'</div></div>';
  h+='</div>';
  h+='<div class="card"><h3>2. Possible contributing factors</h3>';
  if(r.factors.length){
    h+='<p class="fine">More than one can be true at the same time. Each card shows which of your answers it came from.</p>';
    r.factors.forEach(function(f){h+='<div class="factor"><h4>'+f.title+'</h4><p class="because">Because you picked: '+f.src.map(function(t){return '“'+t+'”'}).join(', ')+'</p><p>'+f.why+'</p><p class="help"><b>What can help:</b> '+f.help+'</p></div>'});
  }else h+='<p>Your answers don’t point at a specific factor, which is fine. Many people have shedding with no obvious trigger, and a doctor can help work out what’s going on.</p>';
  h+='</div>';
  var unk=['I can’t see your scalp or hair roots. A doctor can examine them up close.','There are no blood tests here. Depending on you, a doctor may consider things like iron stores, thyroid function, vitamin D and B12.','I can’t tell whether one thing or several are involved.'];
  if(r.skipped.length)unk.push('You left these blank: '+r.skipped.join(', ')+'. That’s okay, but it means I can’t comment on them.');
  if(S.onset==='unsure')unk.push('You weren’t sure when it began, so timing is a gap.');
  h+='<div class="card soft"><h3>3. What I don’t know</h3><ul class="facts">'+unk.map(function(t){return '<li>'+svg(P.cloud,20)+'<span>'+t+'</span></li>'}).join('')+'</ul></div>';
  var steps=[];
  if(r.flags.length)steps.push(['derm','Book a visit with a dermatologist, or your regular doctor first. Take the summary note below.']);
  steps.push(['photos','Take photos of your parting, hairline and crown in the same light. Repeat every 2 weeks. No need to count hairs.']);
  r.factors.forEach(function(f){steps.push([f.id,f.help])});
  steps.push(['plate','Visit the food guide and build a plate you actually enjoy.']);
  steps.push(['gentle','Pick two gentle habits from the care chapter and give them 8 to 12 weeks.']);
  h+='<div class="card"><h3>4. Recommended next steps</h3><p class="fine">Tick them off as you go.</p><div class="steps chips" style="grid-template-columns:1fr">'+steps.map(function(s){var on=S.steps.indexOf(s[0])>-1;return '<button type="button" class="chip" role="checkbox" aria-checked="'+on+'" data-act="step" data-id="'+s[0]+'"><span class="box">'+I.check+'</span><span>'+s[1]+'</span></button>'}).join('')+'</div></div>';
  h+='<div class="card"><h3>5. When to see a doctor</h3><p>Please don’t wait or try home remedies if you notice any of these:</p><ul class="facts">'+
   ['Hair coming out suddenly and heavily.','Bald patches, or hair loss in a clear patch or shape.','A painful, red, scaly, burning or crusty scalp.','Hair loss together with tiredness, feeling cold, weight changes, or changes in your periods.','No improvement after about 3 months of gentle care.','Anything that worries you or makes you feel low. That’s reason enough.'].map(function(t){return '<li>'+svg(P.heart,18)+'<span>'+t+'</span></li>'}).join('')+
   '</ul><p class="note">A doctor decides which tests make sense for you. Please don’t start iron, biotin or other supplements just from a website.</p>'+
   '<details class="more"><summary>A note you can take to the doctor</summary><textarea class="docnote" id="docnote" readonly>'+doctorNote(r)+'</textarea><div class="nav"><button class="btn soft sm" data-act="copy">Copy the note</button><span class="note" id="copyMsg" role="status"></span></div></details></div>';
  h+='<div class="card"><div class="nav"><button class="btn ghost" data-act="back">Back</button><button class="btn primary" data-act="next">Now, let’s feed my hair ♡</button></div></div>';
  return h;}
};

var MYTHS=[
 ['Washing your hair often makes it fall out.',false,'Washing just removes hairs that were already shedding. They show up in the drain instead of on your pillow.'],
 ['Losing around 50 to 100 hairs a day can be normal.',true,'That’s a commonly quoted range. It varies between people, which is why changes over time matter more than a single day’s count.'],
 ['Trimming your hair makes it grow faster.',false,'Hair grows from the root. Trims remove split ends so you keep your length, but they don’t speed anything up.'],
 ['Hair oil alone can regrow thinning hair.',false,'Oil can condition strands and feels lovely, but it doesn’t treat the underlying cause of shedding or thinning.'],
 ['Stress or a big illness can cause increased shedding a few months later.',true,'Yes. Shedding often follows major stress or illness by about 2 to 3 months, and usually settles as things calm down.'],
 ['Biotin tablets stop hair fall for everyone.',false,'Biotin helps when you’re actually low, which is uncommon. High doses can also interfere with some blood tests, so check with a doctor first.']

var mq={i:0,score:0,picked:null};
function mythHTML(){
  var q=MYTHS[mq.i];
  if(mq.i>=MYTHS.length){
    return '<p class="stmt script" style="font-size:1.7rem;font-weight:700">You got '+mq.score+' out of '+MYTHS.length+'.</p><p>'+(mq.score>=5?'Look at you, hair scientist.':'Plenty of these fool everyone. Now you know.')+'</p><button class="btn soft" data-act="mreset">Play again</button>';
  }
  var res='';
  if(mq.picked!==null){var ok=mq.picked===q[1];res='<div class="verdict '+(ok?'good':'bad')+'" role="status"><h4>'+(ok?'Yes!':'Not quite.')+' That’s a '+(q[1]?'fact':'myth')+'.</h4><p>'+q[2]+'</p></div><button class="btn primary" data-act="mnext">'+(mq.i===MYTHS.length-1?'See my score':'Next one')+'</button>';}
  return '<span class="eyebrow">Statement '+(mq.i+1)+' of '+MYTHS.length+'</span><p class="stmt">'+q[0]+'</p>'+(mq.picked===null?'<div class="pair"><button class="btn soft big" data-act="mpick" data-v="0">Myth</button><button class="btn soft big" data-act="mpick" data-v="1">Fact</button></div>':res);
}
screens.myths={
 mood:['think','Hmm. Let’s see how much you know. No pressure, bun.'],
 html:function(){mq={i:0,score:0,picked:null};return '<div class="card taped"><h2>Myth or fact?</h2><div class="qz" id="mythBox">'+mythHTML()+'</div>'+
  '<div class="nav"><button class="btn ghost" data-act="back">Back</button><button class="btn primary" data-act="next">A little game ♡</button></div></div>'}
};

/* game */
var GS={
 heart:'<svg viewBox="0 0 24 24"><path d="'+P.heart+'" fill="#E8708F"/></svg>',
 drop:'<svg viewBox="0 0 24 24"><path d="'+P.drop+'" fill="#7FB6E6"/><path d="M9 14a3 3 0 0 0 2 2.6" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>',
 leaf:'<svg viewBox="0 0 24 24"><path d="'+P.leaf+'" fill="#6BB07A"/><path d="M4 20C8 14 12 10 17 7" stroke="#2F5B3A" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>',
 cloud:'<svg viewBox="0 0 24 24"><path d="'+P.cloud+'" fill="#8D76BF"/><path d="M8.3 11.4l2 .8M15.7 11.4l-2 .8" stroke="#2B2233" stroke-width="1.5" stroke-linecap="round"/><circle cx="9.3" cy="13.4" r="1" fill="#2B2233"/><circle cx="14.7" cy="13.4" r="1" fill="#2B2233"/></svg>'
};
var GN={heart:'Heart',drop:'Water drop',leaf:'Healthy leaf',cloud:'Stress cloud'};
var gameCleanup=null;
screens.game={
 mood:['excited','Game time! Catch hearts, water drops and healthy leaves. Dodge the stress clouds!'],
 html:function(){return '<div class="card taped"><h2>Catch the care</h2><p>Tap the good things for 30 seconds. Hearts and water drops are +1, leaves are +2, and grumpy stress clouds take 2 away.</p>'+
  '<div class="hud"><span>Score: <b id="gScore">0</b></span><span>Time: <b id="gTime">30</b>s</span><div class="hbar" role="progressbar" aria-label="Happy hair meter" aria-valuemin="0" aria-valuemax="30" aria-valuenow="0" id="gBarWrap"><i id="gBar"></i></div></div>'+
  '<div class="board" id="board"><div class="over" id="gOver"><div><h3 class="script" style="font-size:1.8rem;font-family:var(--f-display)">Ready, {pet}?</h3><p>Tap the falling things. Stress clouds are not your friends.</p><button class="btn primary big" data-act="gstart">Start playing</button></div></div></div>'+
  '<div class="nav"><button class="btn ghost" data-act="back">Back</button><button class="btn primary" data-act="next">Skip to the letter ♡</button></div></div>'},
 mount:function(){gameCleanup=setupGame()},
 leave:function(){if(gameCleanup){gameCleanup();gameCleanup=null}gameOn=false}
};
function setupGame(){
  var board=$('#board'),over=$('#gOver'),st={run:false,score:0,time:30,items:[],last:0,spawn:0,raf:0,streak:0};
  var W={heart:.4,drop:.2,leaf:.2,cloud:.2},V={heart:1,drop:1,leaf:2,cloud:-2};
  function hud(){$('#gScore').textContent=st.score;$('#gTime').textContent=Math.max(0,Math.ceil(st.time));$('#gBar').style.width=Math.min(100,st.score/30*100)+'%';$('#gBarWrap').setAttribute('aria-valuenow',Math.min(30,st.score))}
  function pick(){var r=Math.random(),a=0;for(var k in W){a+=W[k];if(r<a)return k}return 'heart'}
  function spawn(){
    var k=pick(),el=document.createElement('button');el.type='button';el.className='gi';el.setAttribute('aria-label',GN[k]+', tap to catch');el.innerHTML=GS[k];
    var x=Math.random()*(board.clientWidth-60)+3,it={el:el,k:k,x:x,y:-60,vy:80+Math.random()*70+(30-st.time)*3,dead:false};
    el.style.transform='translate('+x+'px,'+it.y+'px)';
    el.addEventListener('pointerdown',function(e){e.preventDefault();hit(it)});
    el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();hit(it)}});
    board.appendChild(el);st.items.push(it);
  }
  function floatText(it,t){var s=document.createElement('span');s.className='pop-score';s.textContent=t;s.style.left=(it.x+14)+'px';s.style.top=(it.y)+'px';board.appendChild(s);setTimeout(function(){s.remove()},1000)}
  function hit(it){
    if(!st.run||it.dead)return;it.dead=true;it.el.remove();
    var v=V[it.k];st.score=Math.max(0,st.score+v);
    floatText(it,v>0?'+'+v:String(v));
    if(it.k==='cloud'){st.streak=0;say('Ouch! A stress cloud!','cry');}
    else{st.streak++;if(st.streak===5){say('Five in a row! Look at you go!','excited');}else if(st.streak===10){say('TEN! Madam is unstoppable.','smug');}}
    hud();
  }
  function loop(ts){
    if(!st.run)return;
    var dt=Math.min(0.05,(ts-st.last)/1000||0);st.last=ts;
    st.time-=dt;st.spawn-=dt;
    if(st.spawn<=0){spawn();st.spawn=0.55+Math.random()*0.35}
    var h=board.clientHeight;
    st.items=st.items.filter(function(it){
      if(it.dead)return false;
      it.y+=it.vy*dt;
      if(it.y>h){it.el.remove();return false}
      it.el.style.transform='translate('+it.x+'px,'+it.y+'px)';return true;
    });
    hud();
    if(st.time<=0){finish();return}
    st.raf=requestAnimationFrame(loop);
  }
  function finish(){
    st.run=false;gameOn=false;cancelAnimationFrame(st.raf);
    st.items.forEach(function(it){it.el.remove()});st.items=[];
    var s=st.score,msg,m,line;
    if(s>=24){msg='Absolutely unstoppable!';m='smug';line='Score '+s+'. I knew you’d be good at this, {pet}.'}
    else if(s>=12){msg='Lovely catching!';m='happy';line='Score '+s+'. That’s a happy-hair kind of afternoon.'}
    else{msg='Aww, those clouds got you.';m='pout';line='Score '+s+'. The clouds were being unfair. Try again?'}
    say(line,m);
    over.hidden=false;
    over.innerHTML='<div><h3 style="font-family:var(--f-display);font-size:1.8rem">'+msg+'</h3><p>You scored '+s+'.</p><button class="btn primary big" data-act="gstart">Play again</button></div>';
  }
  window.__gstart=function(){
    over.hidden=true;$$('.gi',board).forEach(function(n){n.remove()});
    st={run:true,score:0,time:30,items:[],last:performance.now(),spawn:0.1,raf:0,streak:0};
    gameOn=true;say('Go go go!','excited');hud();st.raf=requestAnimationFrame(loop);
  };
  hud();
  return function(){st.run=false;cancelAnimationFrame(st.raf);window.__gstart=null};
}

/* letter */
var LETTER=['My Shruti,','I made this little corner of the internet because I couldn’t just sit and watch you worry about something that matters to you. I’m not a doctor, and I’ll never pretend to be one. But I notice when you’re tired, I can nag you about dinner, and I can sit next to you when you make that appointment.','Your hair is not the reason I love you, bun. You know that. But I know it matters to you, and anything that matters to you matters to me.','So here’s my promise. I’ll remind you to eat on time, even when you say you aren’t hungry. I’ll drag you to bed at a sensible hour. I’ll hold your hair tie while you take a breath. And if you want, I’ll come with you to the doctor and carry the folder.','Be patient with your body. It’s doing its best, and so are you.'];
var letterOpen=false;
screens.letter={
 mood:['blush','I wrote you something. Don’t laugh at my handwriting.'],
 html:function(){letterOpen=false;return '<div class="card taped"><h2>A letter for you</h2><div class="env" id="envBox">'+envHTML()+'</div>'+
  '<div class="nav"><button class="btn ghost" data-act="back">Back</button><button class="btn primary" data-act="next">One last thing ♡</button></div></div>'}
};
function envHTML(){
  if(!letterOpen)return '<button type="button" class="seal" data-act="openletter">'+svg(P.heart,56)+'<span>Open your letter</span></button>';
  return '<div class="letter">'+LETTER.map(function(p){return '<p>'+p+'</p>'}).join('')+'<p class="sig">Yours, always annoying, always yours,<br>Aadi</p></div>';
}
screens.bye={
 mood:['kiss','That’s everything, {pet}. I love you. Drink some water and sleep on time.'],
 html:function(){
  var slots=ALBUM.map(function(a){var on=S.album[a[0]];return '<button type="button" class="slot'+(on?'':' lock')+'" data-act="slot" data-k="'+a[0]+'" aria-label="'+(on?a[1]:'Locked sticker')+'"><span class="ph"><img src="'+SPR[a[0]].src+'" alt=""></span><span>'+(on?a[1]:'Locked')+'</span></button>'}).join('');
  var n=Object.keys(S.album).length;
  return '<div class="card taped"><h2>See you soon, my love</h2><p>Thank you for letting me fuss over you. Book that appointment if your answers asked for one, and come back whenever you want a hug in website form.</p>'+
  '<p class="sub">I love you, madam.</p>'+
  '<div class="nav"><button class="btn ghost" data-act="back">Back</button><button class="btn soft" data-act="goresult">See my results again</button><button class="btn primary" data-act="restart">Start again</button></div></div>'+
  '<div class="card soft"><h3>Tiny Aadi sticker book ('+n+' of '+ALBUM.length+')</h3><p class="fine">Poke Aadi on any screen to unlock more moods. Tap a sticker to see him do it again. If you leave him alone for a minute, he falls asleep.</p><div class="album">'+slots+'</div></div>'}
};

/* ---------- rendering & navigation ---------- */
var page=$('#page');
function keyOf(id){return /^q\d+$/.test(id)?'q':id}
function labelOf(i){
  var id=FLOW[i];
  if(/^q\d+$/.test(id))return 'Question '+(+id.slice(1)+1)+' of '+Q.length;
  var map={welcome:'Hello',intro:'Understanding hair fall',result:'What we learned',food:'Food guide',care:'Gentle care',myths:'Myth or fact',game:'A little game',letter:'A letter for you',bye:'Goodbye for now'};
  return map[id];
}
function render(dir){
  var id=FLOW[cur],sc=screens[keyOf(id)];
  page.innerHTML=fill(sc.html(id));
  page.className='page enter'+(dir<0?' back':'');
  var m=typeof sc.mood==='function'?sc.mood(id):sc.mood;
  if(m)say(m[1],m[0]);
  if(sc.mount)sc.mount(id);
  var pct=Math.round(cur/(FLOW.length-1)*100);
  $('#tapeFill').style.width='calc(13px + (100% - 26px) * '+(pct/100)+')';$('#tapeHeart').style.left='calc(13px + (100% - 26px) * '+(pct/100)+')';
  $('#tape').setAttribute('aria-valuenow',pct);$('#tapeLabel').textContent=labelOf(cur);
  $('#tbBack').disabled=cur===0;
  if(id==='welcome'){var a=$('#aadi');a.classList.remove('enter');void a.offsetWidth;a.classList.add('enter')}
  idle();
}
function go(i,dir){
  if(i<0||i>=FLOW.length)return;
  var sc=screens[keyOf(FLOW[cur])];if(sc&&sc.leave)sc.leave();
  cur=i;S.maxIdx=Math.max(S.maxIdx||0,i);save();
  render(dir||(i>=cur?1:-1));
  window.scrollTo(0,0);
}
function openMap(){
  var h='<h2>Journey map</h2><p class="fine">Jump to any chapter you’ve already reached.</p>';
  CHAPTERS.forEach(function(c,n){
    var next=CHAPTERS[n+1]?CHAPTERS[n+1][1]:FLOW.length;
    var here=cur>=c[1]&&cur<next,ok=c[1]<=(S.maxIdx||0);
    h+='<button type="button" class="chap'+(here?' now':'')+'" data-jump="'+c[1]+'"'+(ok?'':' disabled')+'><span>'+c[0]+'</span><span>'+(here?'You are here':ok?'Visit':'Not yet')+'</span></button>';
  });
  h+='<hr style="border:0;border-top:1.5px dashed var(--line);width:100%"><p class="fine">Your answers stay on this device only.</p><button type="button" class="btn ghost" id="clearAll">Clear my answers</button><button type="button" class="btn primary" id="closeMap">Close</button>';
  $('#mapInner').innerHTML=h;$('#mapPanel').hidden=false;$('#tbMap').setAttribute('aria-expanded','true');
  var f=$('#closeMap');if(f)f.focus();
}
function closeMap(){$('#mapPanel').hidden=true;$('#tbMap').setAttribute('aria-expanded','false');$('#tbMap').focus()}
$('#tbMap').addEventListener('click',openMap);
$('#tbBack').addEventListener('click',function(){go(cur-1,-1)});
$('#mapPanel').addEventListener('click',function(e){
  if(e.target===this){closeMap();return}
  var j=e.target.closest('[data-jump]');
  if(j&&!j.disabled){$('#mapPanel').hidden=true;$('#tbMap').setAttribute('aria-expanded','false');go(+j.dataset.jump,+j.dataset.jump<cur?-1:1);return}
  if(e.target.closest('#closeMap')){closeMap();return}
  var c=e.target.closest('#clearAll');
  if(c){
    if(c.dataset.sure){S={onset:null,ans:{},plate:[],pledge:[],steps:[],diet:2,album:{},maxIdx:0};save();$('#mapPanel').hidden=true;go(0,-1)}
    else{c.dataset.sure='1';c.textContent='Tap again to clear everything'}
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#mapPanel').hidden)closeMap()});

page.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act;
  switch(a){
   case 'next':go(cur+1,1);break;
   case 'back':go(cur-1,-1);break;
   case 'chip':toggleChip(t.dataset.q,t.dataset.o,t);break;
   case 'goq':go(2+ +t.dataset.i,+t.dataset.i<+FLOW[cur].slice(1)?-1:1);break;
   case 'skipq':{var q=Q[+FLOW[cur].slice(1)];S.ans[q.id]=[];save();say('Skipped. Zero questions asked, {pet}.','kiss');setTimeout(function(){go(cur+1,1)},500);break}
   case 'onset':{S.onset=t.dataset.o;save();$$('[data-act=onset]').forEach(function(c){c.setAttribute('aria-checked',c.dataset.o===S.onset)});var r=ONSET.filter(function(o){return o[0]===S.onset})[0];say(r[3],r[2]);break}
   case 'cmp':{cmpSel=t.dataset.k;$$('[data-act=cmp]').forEach(function(c){c.setAttribute('aria-pressed',c.dataset.k===cmpSel)});say(cmpSel==='shed'?'Shedding is the whole hair leaving from the root. A little every day is normal.':'Breakage is the strand snapping part-way. That’s about the hair’s condition, not the root.','think');break}
   case 'step':{var id=t.dataset.id,ix=S.steps.indexOf(id);if(ix>-1)S.steps.splice(ix,1);else S.steps.push(id);save();t.setAttribute('aria-checked',ix===-1);if(ix===-1)say('Ticked! Tiny steps count, {pet}.','happy');break}
   case 'copy':{var ta=$('#docnote'),msg=$('#copyMsg');
     var fallback=function(){ta.focus();ta.select();msg.textContent='Press Ctrl+C or long-press to copy.'};
     try{navigator.clipboard.writeText(ta.value).then(function(){msg.textContent='Copied.'},fallback)}catch(err){fallback()}break}
   case 'diet':{S.diet=+t.dataset.v;save();$$('[data-act=diet]').forEach(function(c){c.setAttribute('aria-checked',+c.dataset.v===S.diet)});$('#foodDyn').innerHTML=foodDyn();say(S.diet===0?'Vegetarian it is. There’s plenty here for you.':S.diet===1?'Eggs are in. Easy protein.':'Everything’s on the table. Let’s go.','happy');break}
   case 'ftab':{ftab=t.dataset.g;$('#foodDyn').innerHTML=foodDyn();var tb=$('[data-act=ftab][aria-selected=true]');if(tb&&tb.scrollIntoView)tb.scrollIntoView({block:'nearest',inline:'center'});break}
   case 'plate':{var pid=t.dataset.id,pi=S.plate.indexOf(pid);if(pi>-1)S.plate.splice(pi,1);else S.plate.push(pid);save();$('#foodDyn').innerHTML=foodDyn();if(pi===-1)plateReact();break}
   case 'pledge':{var h=t.dataset.id,hi=S.pledge.indexOf(h),det=t.closest('details');if(hi>-1)S.pledge.splice(hi,1);else S.pledge.push(h);save();
     var on=hi===-1;t.setAttribute('aria-pressed',on);t.textContent=on?'I’ll try this ♡':'I’ll try this';t.className='btn sm '+(on?'primary':'soft');det.classList.toggle('in',on);
     var bx=det.querySelector('.box');bx.style.cssText=on?'background:var(--rose);border-color:var(--rose);color:var(--btn-fg)':'';
     if(on)say(S.pledge.length>=3?'Pledge accepted. I’ll be checking in on you, madam.':'Lovely. That one’s a good choice.',S.pledge.length>=3?'smug':'happy');break}
   case 'mpick':{mq.picked=t.dataset.v==='1';var okk=mq.picked===MYTHS[mq.i][1];if(okk){mq.score++;say('Correct! Smarty.','smug')}else say('Ahh, so close. It’s a tricky one.','pout');$('#mythBox').innerHTML=mythHTML();break}
   case 'mnext':{mq.i++;mq.picked=null;$('#mythBox').innerHTML=mythHTML();if(mq.i>=MYTHS.length)say(mq.score>=5?'Hair scientist! I’m so proud.':'Those are tricky. Now you know.',mq.score>=5?'excited':'happy');else say('Next one…','think');break}
   case 'mreset':{mq={i:0,score:0,picked:null};$('#mythBox').innerHTML=mythHTML();say('Round two!','think');break}
   case 'gstart':if(window.__gstart)window.__gstart();break;
   case 'openletter':{letterOpen=true;$('#envBox').innerHTML=envHTML();say('Okay. Don’t cry. Or do. I’m crying a bit too.','blush');break}
   case 'slot':{var k=t.dataset.k;if(S.album[k]){var m2=null;for(var mk in MOODS){if(MOODS[mk].img===k){m2=mk;break}}say('Ta-da!',m2||'happy')}else say('Locked. Try poking me, or leave me alone for a minute.','think');break}
   case 'goresult':go(FLOW.indexOf('result'),-1);break;
   case 'restart':go(0,-1);break;
  }
});

/* start */
setMood('wave');
$('#say').textContent='';
render(1);
})();
</script>
